<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 运维控制台</title>
<link rel="stylesheet" href="/assets/app.css?v=5">
</head>
<body>
<div id="login" class="login">
  <form id="login-form" autocomplete="off">
    <h1>AI 运维控制台</h1>
    <p class="muted">管理端凭据仅保存于本标签页内存，关闭即失效；不写入浏览器存储。</p>
    <label>管理员 Token
      <input id="token" type="password" required minlength="32" autocomplete="off" spellcheck="false" placeholder="粘贴部署时生成的管理员 Token">
    </label>
    <button type="submit">进入控制台</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">AI 运维控制台</div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <span id="status" class="muted"></span>
    <button id="lock" class="ghost" title="清除内存中的凭据">锁定</button>
  </header>

  <main>
    <section id="view-chat" class="view">
      <div class="split">
        <aside class="pane pane-left">
          <div class="pane-head"><h2>角色</h2><button id="chat-refresh" class="ghost small">刷新</button></div>
          <div class="side-group"><ul id="chat-roles" class="list"></ul></div>
        </aside>
        <div class="pane pane-main">
          <div class="pane-head"><h2 id="chat-title">聊天</h2><span id="chat-model" class="muted small"></span></div>
          <div id="chat-log" class="log"></div>
          <form id="chat-form" class="composer">
            <div class="composer-main">
              <textarea id="chat-text" rows="2" placeholder="描述要运维处理的事情…（回车发送，Shift+回车换行）" required></textarea>
              <button type="submit">发送</button>
            </div>
            <div class="composer-opts">
              <button type="button" id="opts-toggle" class="ghost small" aria-expanded="false">选项 ▾</button>
              <div id="opts-body" class="opts-body" hidden>
                <label class="inline">模式
                  <select id="chat-mode">
                    <option value="confirm">confirm（逐条审批）</option>
                    <option value="readonly">readonly（只读分析）</option>
                    <option value="direct">direct（直接执行）</option>
                  </select>
                </label>
                <label class="inline grow">执行账号（逗号分隔）
                  <input id="chat-users" placeholder="ops_read" autocomplete="off">
                </label>
                <span class="muted small">默认 confirm（逐条审批），最安全。</span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section id="view-console" class="view" hidden>
      <div class="split">
        <aside class="pane pane-left">
          <div class="pane-head"><h2>控制台</h2></div>
          <div id="console-tabs"></div>
        </aside>
        <div id="console-body" class="pane pane-main"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="ghost">关闭</button></div>
      <pre id="modal-body" class="json"></pre>
    </div>
  </div>
</div>

<script src="/assets/app.js?v=5"></script>
</body>
</html>
