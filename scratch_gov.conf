# Governance console for the AI Ops control service (stage 6 review).
#
# Separate port from the read-only website preview on 18080: that server block
# rejects any method other than GET/HEAD and strips the Authorization header,
# which would silently break every approval action. The console is a write
# surface by nature, so it gets its own origin.
#
# Guard rails, in order of what they actually stop:
#   * Basic auth in front of everything, so a scanner that finds the port gets
#     nothing without the password.
#   * Only the console and its API are proxied; anything else 404s.
#   * No upstream cookie handling: the console authenticates with a bearer
#     token typed by the operator, never a shared cookie.
server {
    listen 18082;
    server_name 172.236.254.94;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    auth_basic "AI Ops";
    auth_basic_user_file /etc/nginx/.htpasswd-aiops-gov;

    location = /governance { return 302 /governance/; }
    location ^~ /governance/ {
        proxy_pass http://127.0.0.1:18090/governance/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18090/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
