name: 功能建议
description: 提出一个功能或改进想法
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目是预览阶段、由所有者驱动的产品，较大改动建议先在此对齐方向再动手。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到的实际场景是什么？现在为什么不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
      description: 你期望的行为 / 接口 / 交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么更倾向你的提案。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 控制服务 / API
        - 执行协议 / Agent
        - Web 控制台
        - 部署 / 一键脚本
        - 文档
        - 其他
    validations:
      required: true
