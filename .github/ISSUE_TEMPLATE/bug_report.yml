name: Bug 报告
description: 报告一个可复现的问题（非安全漏洞）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请**不要**用这个模板，见 SECURITY.md。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？期望发生什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 尽量给最小步骤；涉及 API 请贴请求与响应（**去掉 token/密钥**）。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: 例如 0.1.0.dev6 或 sha-xxxxxxx
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、Python 版本、Docker 版本、部署方式（compose / 一键脚本）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 服务或 Agent 的日志片段（**去掉秘密**）
    validations:
      required: false
