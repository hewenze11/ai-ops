services:
  control:
    image: ${AI_OPS_IMAGE:-ghcr.io/hewenze11/ai-ops:latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      # Bind address is configurable so the console can be reached from a
      # browser on the test host. Keep 127.0.0.1 for a strictly local service;
      # set AI_OPS_BIND=0.0.0.0 only when the host is not publicly reachable.
      - "${AI_OPS_BIND:-127.0.0.1}:${AI_OPS_PORT:-8765}:8765"
    environment:
      AI_OPS_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      # Independent role model credentials are configured later in the UI.
      AI_OPS_LOCAL_CONNECTOR_ENABLED: "${AI_OPS_LOCAL_CONNECTOR_ENABLED:-0}"
      AI_OPS_ALERT_NOTIFY_ENABLED: "${AI_OPS_ALERT_NOTIFY_ENABLED:-0}"
      AI_OPS_MEMORY_ARCHIVER_ENABLED: "${AI_OPS_MEMORY_ARCHIVER_ENABLED:-0}"
    volumes:
      - type: bind
        source: ./state
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/admin_token
        target: /run/secrets/admin_token
        read_only: true
        bind:
          create_host_path: false
      # Only needed for legacy file-based SSH credentials; UI-managed keys
      # and passwords live encrypted under /data, never inside the image.
      - type: bind
        source: ./connector
        target: /run/connector
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
