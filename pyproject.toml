[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-service"
version = "0.1.0.dev6"
description = "Lightweight operations control service — execution protocol preview"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "croniter>=6,<7", "tzdata>=2025.1", "paramiko>=3.4,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ai-ops-service = "ai_ops.__main__:main"
ai-ops-backup = "ai_ops.backup_cli:backup_main"
ai-ops-restore = "ai_ops.backup_cli:restore_main"
ai-ops-verify-backup = "ai_ops.backup_cli:verify_main"
ai-ops-admin-token = "ai_ops.admin_cli:main"

[tool.setuptools.packages.find]
include = ["ai_ops*"]

[tool.setuptools.package-data]
"ai_ops.console" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
