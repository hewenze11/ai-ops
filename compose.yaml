services:
  control:
    image: ${AI_OPS_IMAGE:-ai-ops-service:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      # Bind address is configurable so the console can be reached from a
      # browser on the test host. Keep 127.0.0.1 for a strictly local service;
      # set AI_OPS_BIND=0.0.0.0 only when the host is not publicly reachable.
      - "${AI_OPS_BIND:-127.0.0.1}:${AI_OPS_PORT:-8765}:8765"
    environment:
      AI_OPS_ADMIN_TOKEN_FILE: /run/secrets/admin_token
    volumes:
      - ./state:/data
      - ./secrets/admin_token:/run/secrets/admin_token:ro
      # SSH connector keys live outside the image and are mounted read-only.
      - ./connector:/run/connector:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
