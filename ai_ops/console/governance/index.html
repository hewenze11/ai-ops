<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>治理控制台 · AI Ops</title>
<link rel="stylesheet" href="/governance/assets/__AI_OPS_UI_REVISION__/app.css">
</head>
<body>
<noscript>治理控制台需要启用 JavaScript。</noscript>

<!-- 令牌闸门：没有登录页，只有一把钥匙 -->
<section id="gate" class="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="36" height="36"><rect x="3" y="3" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 16.5l4.2 4.2L22.5 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>治理控制台</h1>
    <p class="gate-lede">AI 的每一步，在这里等你点头。</p>
    <label class="field">
      <span class="field-label">管理员令牌</span>
      <input id="gate-token" type="password" spellcheck="false" placeholder="粘贴 AI_OPS_ADMIN_TOKEN" required>
    </label>
    <p class="gate-error" id="gate-error" role="alert" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="gate-submit">进入</button>
    <p class="gate-foot">令牌只保存在这个浏览器标签页（sessionStorage），关闭标签页即遗忘，不会写入磁盘或发往别处。</p>
  </form>
</section>

<!-- 主框架 -->
<div id="shell" class="shell" hidden>
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M10 16.5l4.2 4.2L22.5 12" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <div class="brand-name">治理控制台</div>
        <div class="brand-sub">AI Ops · 把关</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/inbox" data-view="inbox" class="nav-item nav-primary">
        <span class="nav-ico" aria-hidden="true">◉</span><span class="nav-text">收件箱</span><span class="nav-badge" id="badge-inbox" hidden>0</span>
      </a>
      <div class="nav-sep">支撑这个决定的上下文</div>
      <a href="#/lists" data-view="lists" class="nav-item"><span class="nav-ico" aria-hidden="true">≡</span><span class="nav-text">名单与模式</span></a>
      <a href="#/vault" data-view="vault" class="nav-item"><span class="nav-ico" aria-hidden="true">◇</span><span class="nav-text">凭证库</span></a>
      <a href="#/audit" data-view="audit" class="nav-item"><span class="nav-ico" aria-hidden="true">┆</span><span class="nav-text">审计时间线</span></a>
    </nav>
    <div class="rail-foot">
      <div class="signals" id="signals"></div>
      <div class="sync" id="sync"><span class="sync-dot"></span><span class="sync-text">连接中…</span></div>
      <button class="link-btn" id="logout" type="button">忘记令牌并退出</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<!-- 侧拉抽屉（对话上下文 / 凭证详情） -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div class="drawer-title" id="drawer-title"></div>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭">✕</button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/governance/assets/__AI_OPS_UI_REVISION__/app.js" defer></script>
</body>
</html>
